<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riftbound Rules Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Riftbound Rules Chatbot</h1>
            <p class="subtitle">Consultá las reglas del juego de cartas Riftbound</p>
        </header>

        <div id="chat" class="chat-box">
            <div class="message bot">
                <p>¡Hola! Soy el asistente de reglas de Riftbound. Preguntame lo que quieras sobre el juego. Podés adjuntar imágenes de cartas con el botón o pegándolas con Ctrl+V.</p>
            </div>
        </div>

        <div id="preview" class="image-preview"></div>

        <form id="form" class="input-area">
            <label class="attach-btn" title="Adjuntar imagen">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
                <input type="file" id="file-input" accept="image/*" multiple hidden />
            </label>
            <textarea id="input" placeholder="Escribí tu pregunta..." rows="1" autocomplete="off"></textarea>
            <button type="submit" id="btn">Enviar</button>
        </form>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
